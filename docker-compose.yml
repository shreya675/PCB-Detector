services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pcb_aoi}
      POSTGRES_USER: ${POSTGRES_USER:-pcb_aoi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-production}
    volumes:
      - pcb_aoi_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
    environment:
      APP_ENV: container
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pcb_aoi}:${POSTGRES_PASSWORD:-change-me-for-production}@db:5432/${POSTGRES_DB:-pcb_aoi}
      STORAGE_ROOT: /app/reports/inspections
      STATIC_DIR: /nonexistent
      MODEL_PATH: /app/models/weights/yolo11m_official_v4.pt
      SEVERITY_POLICY_PATH: /app/backend/app/core/severity.yaml
      CORS_ORIGINS: http://localhost:8080
      AUTO_CREATE_SCHEMA: "false"
      API_WORKERS: ${API_WORKERS:-1}
    ports:
      - "8000:8000"
    volumes:
      - inspection_reports:/app/reports/inspections
      - ./models/weights:/app/models/weights:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pcb_aoi_db:
  inspection_reports:

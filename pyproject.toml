[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-aoi"
version = "1.0.0"
description = "Academic AI-powered automated optical PCB inspection prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.9,<1",
  "opencv-python-headless>=4.10,<5",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pillow>=10,<13",
  "pyyaml>=6,<7",
  "reportlab>=4.2,<6",
  "alembic>=1.13,<2",
]

[project.optional-dependencies]
ml = ["torch>=2.3,<3", "torchvision>=0.18,<1", "ultralytics>=8.3,<9", "scipy>=1.11,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1", "ruff>=0.8,<1", "mypy>=1.13,<2", "pymupdf>=1.24,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "src*"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
